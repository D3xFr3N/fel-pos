<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FEL POS Movil</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="stylesheet" href="/static/css/mobile.css">
</head>
<body>
  <main class="mobile-app">
    <header class="mobile-header">
      <h1>FEL POS Movil</h1>
      <p>Conteo y precios sincronizados con el servidor.</p>
    </header>

    <section class="card">
      <div class="row">
        <strong>Sesion</strong>
        <span id="session-user">Sin sesion</span>
      </div>
      <form id="login-form" class="stack">
        <label>
          Usuario
          <input name="username" required placeholder="admin o cajero" autocomplete="username">
        </label>
        <label>
          Clave
          <input name="password" type="password" required placeholder="********" autocomplete="current-password">
        </label>
        <button class="btn primary" type="submit">Iniciar sesion</button>
      </form>
      <button id="logout-btn" class="btn ghost" type="button">Cerrar sesion</button>
    </section>

    <section class="card">
      <div class="row">
        <h2>Orden de conteo activa</h2>
        <button id="refresh-order-btn" class="btn ghost" type="button">Actualizar</button>
      </div>
      <p id="order-status" class="hint">Debes iniciar sesion.</p>
      <div id="order-meta" class="stack"></div>
    </section>

    <section class="card">
      <h2>Verificar precio</h2>
      <form id="price-check-form" class="stack">
        <label>
          SKU / codigo de barras
          <input id="price-sku" name="sku" required placeholder="Escanea codigo" autocomplete="off" enterkeyhint="search">
        </label>
        <button class="btn primary" type="submit">Consultar precio</button>
      </form>
      <div id="price-result" class="stack"></div>
    </section>

    <section class="card">
      <h2>Escanear para conteo</h2>
      <p id="dynamic-adjust-status" class="dynamic-adjust">Ajuste dinamico: esperando orden activa.</p>
      <form id="count-form" class="stack">
        <label>
          SKU / codigo de barras
          <input id="count-sku" name="sku" required placeholder="Escanea SKU" autocomplete="off" enterkeyhint="done">
        </label>
        <label>
          Cantidad
          <div class="qty-stepper">
            <button type="button" class="btn ghost" id="count-qty-dec">-</button>
            <input id="count-qty" name="qty" type="number" min="0.01" step="0.01" value="1" required>
            <button type="button" class="btn ghost" id="count-qty-inc">+</button>
          </div>
        </label>
        <label class="inline-option">
          <input id="count-replace-mode" type="checkbox">
          Reemplazar cantidad (no sumar)
        </label>
        <button id="count-submit-btn" class="btn primary" type="submit">Guardar escaneo</button>
      </form>
      <p id="last-scan-feedback" class="hint">Listo para escanear.</p>
      <div id="count-summary" class="stack"></div>
      <div id="count-lines" class="stack"></div>
    </section>
  </main>
  <script src="/static/js/mobile.js"></script>
</body>
</html>
